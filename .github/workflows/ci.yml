name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m psim.docs --check
      - run: python -m pytest -q
      - name: Build the dashboard
        run: python -m psim.build --out site
      - name: Keep the committed reading in step with the code
        run: git diff --exit-code docs/behavioural-reading.md
      - uses: actions/upload-pages-artifact@v3
        if: matrix.python == '3.12' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site

  pages:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
